name: Verify research and source excerpts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out notes and authoring sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Test documentation tools and independent mechanism models
        run: python3 -m unittest discover -s tests -v
      - name: Check generated design edition without modifying files
        run: python3 scripts/build_design_edition.py --check --report /tmp/design-structure.json
      - name: Verify navigation, pinned commits, and source underlying annotated excerpts
        run: python3 scripts/verify_notes.py --report /tmp/agent-notes-validation.json
      - name: Report mechanism models separately from upstream tests
        run: python3 scripts/run_mechanism_models.py --report /tmp/mechanism-models.json
      - name: Show source summary
        if: always()
        run: |
          if [ -f /tmp/agent-notes-validation.json ]; then
            python3 -c 'import json; p=json.load(open("/tmp/agent-notes-validation.json")); print(json.dumps({k:v for k,v in p.items() if k != "matches"}, ensure_ascii=False, indent=2))'
          fi
